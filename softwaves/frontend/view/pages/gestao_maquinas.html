<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestão de Máquinas</title>
  <link rel="stylesheet" href="../../css/maquina.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
</head>

<body>
  <!-- MENU DINÂMICO -->
  <div id="menu-container"></div>

  <div class="container mt-5 pt-5">

    <!-- Botão Adicionar Máquina -->
    <div class="mb-4">
      <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalAdicionarMaquina" id="btnAbrirModalAdicionarMaquina">
        Adicionar Máquina
      </button>
    </div>

    <!-- Filtros -->
    <div class="row mb-3">
      <div class="col-md-8">
        <div class="input-group">
          <select class="form-select" id="colunaFiltroMaquinas" style="max-width: 180px;">
            <option value="nome_maquina" selected>Nome</option>
            <option value="localizacao">Localização</option>
            <option value="status_maquina">Status</option>
            <option value="fabricante">Fabricante</option>
            <option value="data_instalacao_maquina">Data de Instalação</option>
          </select>
          <input type="text" class="form-control" id="filtroMaquinas" placeholder="Digite para filtrar...">
        </div>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-outline-secondary" id="limparFiltroMaquinas">Limpar Filtro</button>
      </div>
    </div>

    <!-- Tabela de Máquinas -->
    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Localização</th>
          <th>Status</th>
          <th>Data de instalação</th>
          <th>Fabricante</th>
          <th>Imagem</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaMaquinas"></tbody>
    </table>
  </div>

  <!-- Modal Adicionar/Editar Máquina -->
  <div class="modal fade" id="modalAdicionarMaquina" tabindex="-1" aria-labelledby="modalAdicionarMaquinaLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formMaquina">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="modalAdicionarMaquinaLabel">Adicionar Máquina</h1>
          </div>
          <div class="modal-body">
            <div id="mensagemAdicionarModalMaquina" class="alert d-none" role="alert"></div>
            <input type="hidden" id="id_maquina" name="id_maquina" />

            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" id="nome" name="nome" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Localização</label>
              <input type="text" id="localizacao" name="localizacao" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select id="status_maquina" name="status_maquina" class="form-select" required>
                <option selected disabled value="">Escolha o status</option>
                <option>Em funcionamento</option>
                <option>Inativa</option>
                <option>Em manutenção</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Data de Instalação</label>
              <input type="date" id="data_instalacao_maquina" name="data_instalacao_maquina" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Fabricante</label>
              <input type="text" id="fabricante" name="fabricante" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="imagem" class="form-label">Imagem da Máquina</label>
              <input type="file" class="form-control" id="imagem" name="imagem" accept="image/*">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Confirmar Exclusão -->
  <div class="modal fade" id="modalConfirmarExclusaoMaquina" tabindex="-1" aria-labelledby="modalConfirmarExclusaoLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="modalConfirmarExclusaoLabel">Confirmar Exclusão</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="corpoModalExclusaoMaquina">
            Tem certeza de que deseja excluir esta máquina?
          </div>
          <div id="mensagemModalExclusaoMaquina" class="alert d-none mt-2" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarExclusaoMaquina">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Visualizar Imagem -->
  <div class="modal fade" id="modalImagem">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Imagem da Máquina</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center" id="modalImagemBody">
          <p class="text-muted">Nenhuma imagem cadastrada.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../components/menu.js"></script>
  <script type="module" src="../../js/gestao_maquina.js"></script>

</body>
</html>
