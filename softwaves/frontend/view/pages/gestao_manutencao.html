<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestão de Manutenções</title>
  <link rel="stylesheet" href="../../css/manutencao.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" />
</head>

<body>
  <div id="menu-container"></div>
  <div class="container mt-5 pt-5">
    <div class="mb-4">
      <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalAdicionarManutencao">
        Adicionar Manutenção
      </button>
    </div>
    <div class="row mb-3">
      <div class="col-md-8">
        <div class="input-group">
          <select class="form-select" id="colunaFiltroManutencao" style="max-width: 150px;">
            <option value="1" selected>Descrição</option>
            <option value="2">Tipo</option>
            <option value="3">Status</option>
            <option value="4">Máquina (ID)</option>
            <option value="5">Usuário (ID)</option>
          </select>
          <div>
            <input type="text" class="form-control" id="filtroManutencao" placeholder="Digite para filtrar...">
          </div>
        </div>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-outline-secondary" id="limparFiltroManutencao">Limpar Filtro</button>
      </div>
    </div>
    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Descrição</th>
          <th>Tipo</th>
          <th>Status</th>
          <th>Máquina</th>
          <th>Usuário</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaManutencao"></tbody>
    </table>
  </div>

  <div class="modal fade" id="modalAdicionarManutencao" tabindex="-1" aria-labelledby="modalAdicionarManutencaoLabel"
    aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="modalAdicionarManutencaoLabel">Informações Manutenção</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div id="mensagemModalManutencao" class="alert d-none" role="alert"></div>
          <form id="formManutencao">
            <input type="hidden" id="id_manutencao" />
            <div class="mb-3">
              <label class="form-label">Descrição</label>
              <input type="text" id="descricao_manutencao" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Tipo</label>
              <select id="tipo_manutencao" class="form-select" required>
                <option selected disabled value="">Selecione o tipo</option>
                <option value="Preventiva">Preventiva</option>
                <option value="Corretiva">Corretiva</option>
                <option value="Preditiva">Preditiva</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select id="status_manutencao" class="form-select" required>
                <option selected disabled value="">Selecione o status</option>
                <option value="Pendente">Pendente</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Concluída">Concluída</option>
                <option value="Cancelado">Cancelado</option>
              </select>
            </div>
            <div class="form-group">
                <label>Máquina associada(ID)</label>
                <select name="maquinas_idmaquinas" id="selectMaquina" required>
                    <option value="">Carregando maquinas...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Usuário associado(ID)</label>
                <select name="usuarios_idusuario" id="selectUsuario" required>
                    <option value="">Carregando usuários...</option>
                </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="submit" form="formManutencao" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalConfirmarExclusaoManutencao" tabindex="-1" aria-labelledby="modalConfirmarExclusaoLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="modalConfirmarExclusaoLabel">Confirmar Exclusão</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="corpoModalExclusaoManutencao">
            Tem certeza de que deseja excluir esta ordem de manutenção?
          </div>
          <div id="mensagemModalExclusaoManutencao" class="alert d-none mt-2" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarExclusaoManutencao">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="../../components/menu.js"></script>
  <!-- Script de gestão -->
  <script type="module">
    import { init } from '../../js/gestao_manutencao.js';
    init();
  </script>

  <script>
        // 🔹 Carregar locais/modalidades no select
        async function carregarMaquina() {
            const select = document.getElementById("selectMaquina");
            try {
                const payload = {
                    table: "maquinas",
                    columns: "idmaquinas, nome_maquina",
                    database: "softwavesafllm"
                };

                const response = await fetch("http://localhost:5000/api/generic_select", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                select.innerHTML = '<option value="">Selecione a maquina</option>';

                if (data.length === 0) {
                    select.innerHTML = '<option value="">Nenhuma maquina encontrado</option>';
                    return;
                }

                data.forEach(maquina => {
                    const option = document.createElement("option");
                    option.value = maquina.idmaquinas;
                    option.textContent = maquina.nome_maquina;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao carregar maquina:", error);
                select.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        document.addEventListener("DOMContentLoaded", carregarMaquina);
    </script>
    <script>
        // 🔹 Carregar locais/modalidades no select
        async function carregarUsuario() {
            const select = document.getElementById("selectUsuario");
            try {
                const payload = {
                    table: "usuarios",
                    columns: "idusuario, nome_usuario",
                    database: "softwavesafllm"
                };

                const response = await fetch("http://localhost:5000/api/generic_select", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                select.innerHTML = '<option value="">Selecione o usuário</option>';

                if (data.length === 0) {
                    select.innerHTML = '<option value="">Nenhum usuário encontrado</option>';
                    return;
                }

                data.forEach(usuario => {
                    const option = document.createElement("option");
                    option.value = usuario.idusuario;
                    option.textContent = usuario.nome_usuario;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao carregar maquina:", error);
                select.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        document.addEventListener("DOMContentLoaded", carregarUsuario);
    </script>
</body>
</html>
