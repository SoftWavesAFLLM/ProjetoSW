<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestão de Peças</title>
  <link rel="stylesheet" href="../../css/pecas.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
</head>

<body>
  <div id="menu-container"></div>
  <div class="container mt-5 pt-5">
    <div class="mb-4">
      <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#exampleModalPeca">
        Adicionar Peças
      </button>
    </div>
    <div class="row mb-3">
      <div class="col-md-8">
        <div class="input-group">
          <select class="form-select" id="colunaFiltroPecas" style="max-width: 150px;">
            <option value="1" selected>Nome</option>
            <option value="2">Código</option>
            <option value="3">Estoque</option>
          </select>
          <div>
            <input type="text" class="form-control" id="filtroPecas" placeholder="Digite para filtrar...">
          </div>
        </div>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-outline-secondary" id="limparFiltroPecas">Limpar Filtro</button>
      </div>
    </div>
    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Código</th>
          <th>Estoque</th>
          <th class="text-center">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaPecas"></tbody>
    </table>
  </div>

  <div class="modal fade" id="exampleModalPeca" tabindex="-1" aria-labelledby="exampleModalPecaLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalPecaLabel">Adicionar Peças</h1>
        </div>
        <div class="modal-body">
          <form id="formPeca">
            <div id="mensagemModalPeca" class="alert d-none" role="alert"></div>
            <input type="hidden" id="idpeca" />
            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" id="nomePeca" placeholder="" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Código</label>
              <input type="text" class="form-control" id="codigoPeca" placeholder="" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Quantidade</label>
              <input type="text" class="form-control" id="quantidadePeca" placeholder="" required />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
              <button type="submit" class="btn btn-primary" id="salvarPeca">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

<div class="modal fade" id="modalConfirmarExclusao" tabindex="-1" aria-labelledby="modalConfirmarExclusaoLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalConfirmarExclusaoLabel">Confirmar Exclusão</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="corpoModalExclusao">
          Tem certeza de que deseja excluir esta peça? Esta ação não pode ser desfeita.
        </div>
        <div id="mensagemModalExclusao" class="alert d-none mt-2" role="alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnConfirmarExclusao">Excluir</button>
      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="../../js/gestao_pecas.js"></script>
  <script src="../../components/menu.js"></script>
  <script type="module">
    import { init } from '../../js/gestao_pecas.js';
    init();
  </script>
</body>

</html>
