<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relatórios de Ordens de Trabalho</title>
    <link rel="stylesheet" href="../../css/relatorios_to.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body>
    <div id="menu-container"></div>
    <div class="container mt-5 pt-5">
        <div class="mb-4">
            <button type="button" class="btn btn-secondary" data-bs-toggle="modal"
                data-bs-target="#modalAdicionarOrdem">
                Adicionar Ordem de Trabalho
            </button>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <div class="input-group">
                    <select class="form-select" id="colunaFiltroOrdens" style="max-width: 180px;">
                        <option value="idordens">ID Ordem</option>
                        <option value="descricao_manutencao" selected>Descrição</option>
                        <option value="status_ordem">Status</option>
                        <option value="tipo_manutencao">Tipo de Manutenção</option>
                        <option value="data_criacao">Data de Criação</option>
                        <option value="data_conclusao">Data de Conclusão</option>
                        <option value="ordens_manutencao_idordens_manutencao">ID Manutenção</option>
                        <option value="usuarios_idusuario">ID Usuário</option>
                    </select>
                    <div id="filtroTextoContainer" class="d-flex">
                        <input type="text" class="form-control" id="filtroOrdens" placeholder="Digite para filtrar...">
                    </div>
                    <div id="filtroDataContainer" class="d-none align-items-center gap-2 ms-2">
                        <label for="filtroDataInicio">De:</label>
                        <input type="date" class="form-control" id="filtroDataInicio">
                        <label for="filtroDataFim">Até:</label>
                        <input type="date" class="form-control" id="filtroDataFim">
                    </div>
                </div>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-outline-secondary" id="limparFiltroOrdens">Limpar Filtro</button>
            </div>
        </div>

        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Status</th>
                    <th>Tipo Manutenção</th>
                    <th>Data Criação</th>
                    <th>Data Conclusão</th>
                    <th>ID Manutenção</th>
                    <th>ID Usuário</th>
                    <th class="text-center">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaOrdens"></tbody>
        </table>
    </div>

    <div class="modal fade" id="modalAdicionarOrdem" tabindex="-1" aria-labelledby="modalAdicionarOrdemLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formOrdem">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modalAdicionarOrdemLabel">Adicionar Ordem de Trabalho</h1>
                    </div>
                    <div class="modal-body">
                        <div id="mensagemModalOrdem" class="alert d-none" role="alert"></div>
                        <input type="hidden" id="id_ordem" name="id_ordem" />
                        <div class="mb-3">
                            <label class="form-label">Descrição da Manutenção</label>
                            <textarea id="descricao_manutencao" name="descricao_manutencao" class="form-control"
                                required rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status</label>
                                <select id="status_ordem" name="status_ordem" class="form-select" required>
                                    <option selected disabled value="">Escolha...</option>
                                    <option>Aberta</option>
                                    <option>Em andamento</option>
                                    <option>Concluída</option>
                                    <option>Cancelada</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Tipo de Manutenção</label>
                                <select id="tipo_manutencao" name="tipo_manutencao" class="form-select" required>
                                    <option selected disabled value="">Escolha...</option>
                                    <option>Preventiva</option>
                                    <option>Corretiva</option>
                                    <option>Preditiva</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Data de Criação</label>
                                <input type="date" id="data_criacao" name="data_criacao" class="form-control"
                                    required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Data de Conclusão</label>
                                <input type="date" id="data_conclusao" name="data_conclusao" class="form-control" />
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label>Ordem Manutenção associado(ID)</label>
                                <select name="idordens_manutencao" id="selectManutencao" required>
                                    <option value="">Carregando Ordem Manutenção...</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Usuário associado(ID)</label>
                                <select name="usuarios_idusuario" id="selectUsuario" required>
                                    <option value="">Carregando usuários...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalConfirmarExclusaoOrdem" tabindex="-1" aria-labelledby="modalConfirmarExclusaoLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalConfirmarExclusaoLabel">Confirmar Exclusão</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="corpoModalExclusaoOrdem">
                        Tem certeza de que deseja excluir esta ordem de trabalho?
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarExclusaoOrdem">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="../../components/menu.js"></script>
    <script type="module">
        import { init } from '../../js/relatorios_to.js';
        init();
    </script>

    <script>
        // 🔹 Carregar locais/modalidades no select
        async function carregarManutencao() {
            const select = document.getElementById("selectManutencao");
            try {
                const payload = {
                    table: "ordens_manutencao",
                    columns: "idordens_manutencao, descricao_problema",
                    database: "softwavesafllm"
                };

                const response = await fetch("http://localhost:5000/api/generic_select", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                select.innerHTML = '<option value="">Selecione o Ordem de Manutenção</option>';

                if (data.length === 0) {
                    select.innerHTML = '<option value="">Nenhuma Ordem encontrado</option>';
                    return;
                }

                data.forEach(manutencao => {
                    const option = document.createElement("option");
                    option.value = manutencao.idordens_manutencao;
                    option.textContent = manutencao.descricao_problema;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao carregar maquina:", error);
                select.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        document.addEventListener("DOMContentLoaded", carregarManutencao);
    </script>

    <script>
        // 🔹 Carregar locais/modalidades no select
        async function carregarUsuario() {
            const select = document.getElementById("selectUsuario");
            try {
                const payload = {
                    table: "usuarios",
                    columns: "idusuario, nome_usuario",
                    database: "softwavesafllm"
                };

                const response = await fetch("http://localhost:5000/api/generic_select", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                select.innerHTML = '<option value="">Selecione o usuário</option>';

                if (data.length === 0) {
                    select.innerHTML = '<option value="">Nenhum usuário encontrado</option>';
                    return;
                }

                data.forEach(usuario => {
                    const option = document.createElement("option");
                    option.value = usuario.idusuario;
                    option.textContent = usuario.nome_usuario;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao carregar maquina:", error);
                select.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        document.addEventListener("DOMContentLoaded", carregarUsuario);
    </script>
</body>

</html>
