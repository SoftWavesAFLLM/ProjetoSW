<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestão de Usuários</title>

  <link rel="stylesheet" href="../../css/usuario.css" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet" crossorigin="anonymous" />
</head>

<body>

  <!-- 🔥 MENU DINÂMICO AQUI -->
  <div id="menu-container"></div>

  <!-- 🔥 TODA A PÁGINA PRECISA TER MARGEM PARA NÃO FICAR SOB O MENU -->
  <div class="container mt-5 pt-5">

    <div class="mb-4">
      <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalUsuario"
        id="btnAbrirModalAdicionar">
        Adicionar Usuário
      </button>
    </div>

    <div class="row mb-3">
      <div class="col-md-8">
        <div class="input-group">
          <select class="form-select" id="colunaFiltroUsuarios" style="max-width: 150px;">
            <option value="1" selected>Nome</option>
            <option value="2">E-mail</option>
            <option value="3">CPF/CNPJ</option>
            <option value="5">Cargo</option>
          </select>
          <div>
            <input type="text" class="form-control" id="filtroUsuarios" placeholder="Digite para filtrar...">
          </div>
        </div>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button class="btn btn-outline-secondary" id="limparFiltroUsuarios">Limpar Filtro</button>
      </div>
    </div>

    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>E-mail</th>
          <th>CPF/CNPJ</th>
          <th>Telefone</th>
          <th>Cargo</th>
          <th>Senha</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="usersTablesBody"></tbody>
    </table>
  </div>

  <!-- Modal Adicionar/Editar Usuário -->
  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formUsuario">
          <input type="hidden" id="id_usuario" name="id_usuario">

          <div class="modal-header">
            <h1 class="modal-title fs-5" id="modalUsuarioLabel">Adicionar Usuário</h1>
          </div>

          <div class="modal-body">
            <div id="mensagemAdicionarModal" class="alert d-none"></div>

            <div class="mb-3">
              <label class="form-label">Nome:</label>
              <input id="nome_funcionario" type="text" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Email:</label>
              <input id="email" type="email" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">CPF/CNPJ:</label>
              <input id="CPF" type="text" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Telefone:</label>
              <input id="telefone" type="text" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Cargo:</label>
              <input id="funcao" type="text" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Senha:</label>
              <input id="senha_funcionario" type="password" class="form-control" required />
            </div>

          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal de Exclusão -->
  <div class="modal fade" id="modalConfirmarExclusaoUsuario" tabindex="-1"
    aria-labelledby="modalConfirmarExclusaoLabel" aria-hidden="true">

    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h1 class="modal-title fs-5" id="modalConfirmarExclusaoLabel">Confirmar Exclusão</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div id="corpoModalExclusaoUsuario">
            Tem certeza de que deseja excluir este usuário?
          </div>
          <div id="mensagemModalExclusaoUsuario" class="alert d-none mt-2"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnConfirmarExclusaoUsuario">Excluir</button>
        </div>

      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>

  <script src="../../js/gestao_usuarios.js"></script>

  <!-- MENU FIXO EM TODAS AS PÁGINAS -->
  <script src="../../components/menu.js"></script>

  <script type="module">
    import { init } from '../../js/gestao_usuarios.js';
    init();
  </script>

</body>

</html>
