<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores dos Sensores</title>

    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="../../css/dashboard.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- MENU -->
    <div id="menu-container"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="conteudo-principal">
        <header>
            ⚙️ Sistema de Monitoramento de Sensores
        </header>

        <h1>📊 Indicadores dos Sensores</h1>

        <!-- CARDS EM LINHA -->
        <div class="linha-indicadores">
            <div class="card">
                <div class="topico">Temperatura</div>
                <div id="temp" class="valor">-- °C</div>
            </div>

            <div class="card">
                <div class="topico">Umidade</div>
                <div id="umid" class="valor">-- %</div>
            </div>

            <div class="card">
                <div class="topico">Movimento</div>
                <div id="movimento" class="valor">--</div>
            </div>
        </div>

        <hr>

        <!-- GRÁFICOS EM LINHA -->
        <div class="graficos">
            <div class="grafico">
                <canvas id="graficoTemp"></canvas>
            </div>
            <div class="grafico">
                <canvas id="graficoUmid"></canvas>
            </div>
            <div class="grafico">
                <canvas id="graficoMov"></canvas>
            </div>
        </div>
    </div>

    <!-- JS do menu -->
    <script type="module" src="../../components/menu.js"></script>

    <!-- JS do dashboard -->
    <script type="module">
        import { carregarDashboards } from './dashboards.js';
        window.addEventListener('DOMContentLoaded', carregarDashboards);
    </script>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
